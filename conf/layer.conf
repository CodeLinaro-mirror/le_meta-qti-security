BBFILES += "${LAYERDIR}/recipes/*/*.bb ${LAYERDIR}/recipes/*/*.bbappend ${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS += "qti-sec"
BBFILE_PRIORITY_qti-sec = "17"
BBFILE_PATTERN_qti-sec := "^${LAYERDIR}/"
LAYERDEPENDS_qti-sec = "core"
LAYERSERIES_COMPAT_qti-sec = "dunfell"
LAYERVERSION_qti-sec = "1"
